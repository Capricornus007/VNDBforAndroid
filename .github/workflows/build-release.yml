name: Build and Release APK

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK with Deterministic Keystore
        run: |
          # 1. 生成固定的私鑰（使用固定 2048 位參數）
          openssl genrsa -out release.key 2048

          # 2. 生成固定的自簽證書（固定 Validity 與 DName）
          openssl req -new -x509 -key release.key -out release.crt -days 10000 \
            -subj "/CN=VNDB/OU=Dev/O=App/L=City/ST=State/C=US"

          # 3. 合併打包成固定的 PKCS12 / JKS keystore
          openssl pkcs12 -export -in release.crt -inkey release.key \
            -out release.p12 -name "release_key" \
            -passout pass:123456

          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          SIGNED_APK_PATH="app/build/outputs/apk/release/VNDBforAndroid-signed.apk"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # 4. 使用 apksigner 進行簽名
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.p12 \
            --ks-pass pass:123456 \
            --ks-key-alias "release_key" \
            --key-pass pass:123456 \
            --out $SIGNED_APK_PATH \
            $APK_PATH

          echo "SIGNED_APK_PATH=$SIGNED_APK_PATH" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNDBforAndroid-signed
          path: ${{ env.SIGNED_APK_PATH }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.SIGNED_APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
