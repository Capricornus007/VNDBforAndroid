          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.jks \
            --ks-pass pass:"vndb_release_password_2026" \
            --ks-key-alias "release_key" \
            --key-pass pass:"vndb_release_password_2026" \
            --out $SIGNED_APK_PATH \
            $APK_PATH

          echo "SIGNED_APK_PATH=$SIGNED_APK_PATH" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNDBforAndroid-signed
          path: ${{ env.SIGNED_APK_PATH }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.SIGNED_APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
