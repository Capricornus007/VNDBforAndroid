name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK with Fixed Embedded Keystore
        run: |
          # 固定的 JKS 密鑰 Base64 編碼
          KEYSTORE_BASE64=""

          # 解碼為 release.jks
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          SIGNED_APK_PATH="app/build/outputs/apk/release/VNDBforAndroid-signed.apk"

          # 取得最新 build-tools 並執行簽名
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.jks \
            --ks-pass pass:"vndb_release_password_2026" \
            --ks-key-alias "release_key" \
            --key-pass pass:"vndb_release_password_2026" \
            --out $SIGNED_APK_PATH \
            $APK_PATH

          echo "SIGNED_APK_PATH=$SIGNED_APK_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.SIGNED_APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
